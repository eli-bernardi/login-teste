
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">

    <script src="../js/cadCiclista.js" defer></script>

    <title>Cadastro</title>
</head>

<body>

    <header>
        <a href="../index.html">Home</a>
    </header>

    <main>

        <h1>Cadastrar Ciclista</h1>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Digite seu email">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="Digite seu CPF">

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" placeholder="Digite seu endereço">

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="Digite seu celular">

            <button id="btn_cadastrar" type="submit">
                Cadastrar
            </button>

        </form>

        <div id="res"></div>

    </main>

</body>

</html>
