<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="../js/cadCiciclista.js" defer></script>
    <title>Cadastro do Ciclista</title>
</head>

<body>
    <header>
        <a href="../index.html">Home</a>&emsp;
    </header>

    <main>
        <h1>Cadastrar ciclista</h1>
        <br><br>
        <form>
            <label for="nome">Nome: </label><br>
            <input type="text" id="nome"><br><br>

            <label for="email">Email: </label><br>
            <input type="text" id="email"><br><br>

            <label for="senha">Senha: </label><br>
            <input type="text" id="senha"><br><br>

            <label for="cpf">CPF: </label><br>
            <input type="text" id="cpf"><br><br>

            <label for="endereco">Endereço: </label><br>
            <input type="text" id="endereco"><br><br>

            <label for="telefone">Telefone: </label><br>
            <input type="text" id="telefone"><br><br>

            <button id="btn">Cadastrar</button>
            <br><br>
        </form>
        <div id="res"></div>
    </main>
</body>

</html>
